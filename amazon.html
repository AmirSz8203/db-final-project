<!DOCTYPE html>
<html>
  <head>
    <title>Amazon Project</title>

    <!-- This code is needed for responsive design to work.
      (Responsive design = make the website look good on
      smaller screen sizes like a phone or a tablet). -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Load a font called Roboto from Google Fonts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <!-- Here are the CSS files for this page. -->
    <link rel="stylesheet" href="styles/shared/general.css" />
    <link rel="stylesheet" href="styles/shared/amazon-header.css" />
    <link rel="stylesheet" href="styles/pages/amazon.css" />
  </head>
  <body>
    <div class="amazon-header">
      <div class="amazon-header-left-section">
        <a href="amazon.html" class="header-link">
          <img class="amazon-logo" src="images/amazon-logo-white.png" />
          <img
            class="amazon-mobile-logo"
            src="images/amazon-mobile-logo-white.png"
          />
        </a>
      </div>

      <div class="amazon-header-middle-section">
        <input class="search-bar" type="text" placeholder="Search" />

        <button class="search-button">
          <img class="search-icon" src="images/icons/search-icon.png" />
        </button>
      </div>

      <div class="amazon-header-right-section">
        <a class="orders-link header-link" href="login.html" id="auth-link">
          <span class="returns-text" id="auth-line1">Hello, sign in</span>
          <span class="orders-text" id="auth-line2">Account & Lists</span>
        </a>

        <a class="orders-link header-link" href="orders.html">
          <span class="returns-text">Returns</span>
          <span class="orders-text">& Orders</span>
        </a>

        <a class="cart-link header-link" href="checkout.html">
          <img class="cart-icon" src="images/icons/cart-icon.png" />
          <div class="cart-quantity js-cart-quantity"></div>
          <div class="cart-text">Cart</div>
        </a>
      </div>
    </div>

    <div class="main">
      <div class="products-grid js-products-grid"></div>
    </div>

    <script type="module" src="./scripts/amazon.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', async () => {
        const API_BASE_URL = 'http://localhost:8000';
        const token = localStorage.getItem('accessToken');
        const authLink = document.getElementById('auth-link');
        const authLine1 = document.getElementById('auth-line1');
        const authLine2 = document.getElementById('auth-line2');

        if (token) {
          try {
            const response = await fetch(`${API_BASE_URL}/users/me`, {
              headers: { 'Authorization': `Bearer ${token}` }
            });

            if (response.ok) {
              const user = await response.json();
              authLine1.textContent = `Hello, ${user.username}`;
              authLine2.textContent = 'Account & Lists';
              authLink.href = '#'; // Or a profile page
              authLink.addEventListener('click', (e) => {
                e.preventDefault();
                if (confirm('Are you sure you want to log out?')) {
                  localStorage.removeItem('accessToken');
                  window.location.href = 'login.html';
                }
              });

              // Change "Account & Lists" to "Logout" on hover
              authLink.addEventListener('mouseover', () => authLine2.textContent = 'Logout?');
              authLink.addEventListener('mouseout', () => authLine2.textContent = 'Account & Lists');

            } else {
              localStorage.removeItem('accessToken'); // Invalid token
            }
          } catch (error) {
            console.error('Error fetching user data:', error);
            localStorage.removeItem('accessToken');
          }
        }
      });
    </script>
  </body>
</html>

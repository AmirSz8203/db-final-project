services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      DB_PATH: /data/myshop.db
    volumes:
      - db-data:/data
    ports:
      - "8001:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  db-data:
